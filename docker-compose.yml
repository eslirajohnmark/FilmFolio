# FilmFolio in Docker: the website, queue worker, scheduler and MySQL database.
#
#   docker compose up -d --build      start (first run builds the image, ~3-5 min)
#   open http://localhost:8080        (from a phone on the same Wi-Fi: http://<this-PC's-IP>:8080)
#   docker compose logs -f app        follow the web logs
#   docker compose down               stop (the database is kept in the dbdata volume)
#   docker compose down -v            stop AND delete the Docker database
#
# Settings come from your .env (mounted read-only). The values under x-app-env
# override it for Docker: database connection, URL, production mode.
#
# To use a MySQL server on this machine instead of the bundled one (no second copy
# of the data), add to .env:  COMPOSE_FILE="docker-compose.yml;docker-compose.host-db.yml"
# (use ":" instead of ";" on macOS/Linux). See docker-compose.host-db.yml.

x-app: &app
  build: .
  image: filmfolio-app
  restart: unless-stopped
  volumes:
    - ./.env:/var/www/html/.env:ro
    # Avatars, posters and videos: the same folder the local site uses
    - ./storage/app/public:/var/www/html/storage/app/public
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-app-env: &app-env
  APP_ENV: ${DOCKER_APP_ENV:-production}
  APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
  APP_URL: ${DOCKER_APP_URL:-http://localhost:8080}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: filmfolio
  DB_USERNAME: filmfolio
  DB_PASSWORD: ${DOCKER_DB_PASSWORD:-filmfolio-secret}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  LOG_CHANNEL: stack
  LOG_STACK: single,stderr

services:
  # The website (Apache + PHP 8.3)
  app:
    <<: *app
    ports:
      - "${DOCKER_APP_PORT:-8080}:8080"
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    depends_on:
      mysql:
        condition: service_healthy

  # Sends queued emails (welcome, new follower, review comment)
  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1", "--max-time=3600"]
    environment: *app-env
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  # Runs scheduled tasks (daily TMDB film sync)
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    environment: *app-env
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  # The database. On first start the app container creates the tables, the admin
  # (from ADMIN_* in .env) and imports films from TMDB.
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: filmfolio
      MYSQL_USER: filmfolio
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-filmfolio-secret}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-filmfolio-root-secret}
    volumes:
      - dbdata:/var/lib/mysql
    # Reachable from this machine (HeidiSQL etc.) on 3308, clear of any local MySQL on 3306/3307
    ports:
      - "${DOCKER_DB_PORT:-3308}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  dbdata:
