# FilmFolio in Docker
#
#   docker compose up -d --build      start (first run builds the image, ~3-5 min)
#   open http://localhost:8080
#   docker compose logs -f app        follow the web logs
#   docker compose down               stop (data is kept in volumes)
#   docker compose down -v            stop AND delete the database and uploads
#
# Settings come from your .env (mounted read-only). The values under x-app-env
# override it for Docker: database host, URL, production mode.

x-app: &app
  build: .
  image: filmfolio-app
  restart: unless-stopped
  volumes:
    - ./.env:/var/www/html/.env:ro
    - uploads:/var/www/html/storage/app/public
  depends_on:
    mysql:
      condition: service_healthy

x-app-env: &app-env
  APP_ENV: ${DOCKER_APP_ENV:-production}
  APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
  APP_URL: ${DOCKER_APP_URL:-http://localhost:8080}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: filmfolio
  DB_USERNAME: filmfolio
  DB_PASSWORD: ${DOCKER_DB_PASSWORD:-filmfolio-secret}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  LOG_CHANNEL: stack
  LOG_STACK: single,stderr

services:
  # The website (Apache + PHP 8.3)
  app:
    <<: *app
    ports:
      - "${DOCKER_APP_PORT:-8080}:8080"
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"

  # Sends queued emails (welcome, new follower, review comment)
  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1", "--max-time=3600"]
    environment: *app-env
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  # Runs scheduled tasks (daily TMDB film sync)
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    environment: *app-env
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: filmfolio
      MYSQL_USER: filmfolio
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-filmfolio-secret}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-filmfolio-root-secret}
    volumes:
      - dbdata:/var/lib/mysql
      # *.sql files here are loaded once, when the database volume is first created
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    # 3307 on your machine, so it doesn't clash with Laragon's MySQL on 3306
    ports:
      - "${DOCKER_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  dbdata:
  uploads:
