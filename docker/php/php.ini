; FilmFolio PHP settings for the Docker image.

; Admins can upload trailer/teaser videos up to 500 MB (FilmRequest::MAX_VIDEO_KB).
upload_max_filesize = 512M
post_max_size = 520M
memory_limit = 256M
max_execution_time = 120

expose_php = Off

; Code is baked into the image, so OPcache never needs to re-check files.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
